<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 898" role="img" aria-labelledby="title desc">
<title id="title">现有界面 + 独立业务后端</title><desc id="desc">下面是模块与数据流建议；除现有UI/配置外均待实现。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#696969"/></marker></defs>
<rect width="1060" height="898" rx="20" fill="#f7f7f7"/>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#202020">
<text x="32" y="40" font-size="24" font-weight="600">现有界面 + 独立业务后端</text>
<text x="32" y="68" font-size="14" fill="#666">下面是模块与数据流建议；除现有UI/配置外均待实现。</text>
<rect x="32" y="94" width="340" height="64" rx="12" fill="#fff" stroke="#d5d5d5"/>
<text x="51" y="121" font-size="17" font-weight="600">Qt UI / 配置快照</text>
<text x="51" y="143" font-size="12" fill="#777">UI</text>
<text x="410" y="127" font-size="15" fill="#4d4d4d">保留 Win11 白灰；开始、暂停、规则与模式命令</text>
<rect x="32" y="190" width="340" height="64" rx="12" fill="#fff" stroke="#d5d5d5"/>
<text x="51" y="217" font-size="17" font-weight="600">步骤按需采集 / 回放源</text>
<text x="51" y="239" font-size="12" fill="#777">CAP</text>
<text x="410" y="223" font-size="15" fill="#4d4d4d">内存像素；空闲停采集；默认不写图像文件</text>
<rect x="32" y="286" width="340" height="64" rx="12" fill="#fff" stroke="#d5d5d5"/>
<text x="51" y="313" font-size="17" font-weight="600">视觉 worker：OpenCV + OCR</text>
<text x="51" y="335" font-size="12" fill="#777">VIS</text>
<text x="410" y="319" font-size="15" fill="#4d4d4d">可信独立依赖；文字、框、分数与模型版本</text>
<rect x="32" y="382" width="340" height="64" rx="12" fill="#fff" stroke="#d5d5d5"/>
<text x="51" y="409" font-size="17" font-weight="600">页面 / 卖单语义</text>
<text x="51" y="431" font-size="12" fill="#777">SEM</text>
<text x="410" y="415" font-size="15" fill="#4d4d4d">正确页面、字段关联、条目新鲜度与歧义</text>
<rect x="32" y="478" width="340" height="64" rx="12" fill="#fff" stroke="#d5d5d5"/>
<text x="51" y="505" font-size="17" font-weight="600">纯规则匹配</text>
<text x="51" y="527" font-size="12" fill="#777">RULE</text>
<text x="410" y="511" font-size="15" fill="#4d4d4d">Match / NoMatch / NeedsReview + 可解释原因</text>
<rect x="32" y="574" width="340" height="64" rx="12" fill="#fff" stroke="#d5d5d5"/>
<text x="51" y="601" font-size="17" font-weight="600">双阶段状态机 / 调度</text>
<text x="51" y="623" font-size="12" fill="#777">RUN</text>
<text x="410" y="607" font-size="15" fill="#4d4d4d">步骤申请观察；长等待停采集；有界短时复核</text>
<rect x="32" y="670" width="340" height="64" rx="12" fill="#fff" stroke="#d5d5d5"/>
<text x="51" y="697" font-size="17" font-weight="600">意图适配器（先测试桩）</text>
<text x="51" y="719" font-size="12" fill="#777">ACT</text>
<text x="410" y="703" font-size="15" fill="#4d4d4d">发起不等于成功；真实输入接入单独决策</text>
<rect x="32" y="766" width="340" height="64" rx="12" fill="#fff" stroke="#d5d5d5"/>
<text x="51" y="793" font-size="17" font-weight="600">回执账本 / UI状态投影</text>
<text x="51" y="815" font-size="12" fill="#777">LOG</text>
<text x="410" y="799" font-size="15" fill="#4d4d4d">必要结果记录；不逐帧写日志，不自动保存截图</text>
